<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
<title>Copilot</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 -apple-system, system-ui, sans-serif; color: #e8e8ea; }
  #panel { background: rgba(18,18,22,.88); border: 1px solid rgba(255,255,255,.12); border-radius: 12px;
           height: 100vh; display: flex; flex-direction: column; padding: 10px; gap: 8px; }
  header { display: flex; gap: 6px; align-items: center; -webkit-app-region: drag; }
  header .title { font-weight: 600; flex: 1; }
  button, select, textarea { -webkit-app-region: no-drag; font: inherit; color: inherit; background: rgba(255,255,255,.08);
           border: 1px solid rgba(255,255,255,.14); border-radius: 6px; padding: 4px 8px; }
  button { cursor: pointer; } button:hover { background: rgba(255,255,255,.16); }
  button.on { background: #1f7a4d; }
  .box { flex: 1; min-height: 0; overflow: auto; background: rgba(0,0,0,.25); border-radius: 8px; padding: 8px; white-space: pre-wrap; }
  .label { font-size: 11px; text-transform: uppercase; opacity: .55; margin-bottom: 2px; }
  #answer { flex: 2; }
  pre { background: #0b0b0e; padding: 8px; border-radius: 6px; overflow: auto; margin: 6px 0; }
  textarea { width: 100%; resize: none; height: 48px; }
  #status { font-size: 11px; opacity: .6; }
</style>
</head>
<body>
<div id="panel">
  <header>
    <span class="title">Copilot</span>
    <select id="mode"><option value="reply">Reply</option><option value="code">Code</option><option value="design">Design</option></select>
    <button id="mic">Mic: off</button>
    <button id="chatBtn" title="Cmd+Shift+C">Paste chat</button>
    <button id="go" title="Cmd+Shift+Enter">Suggest</button>
  </header>
  <div><div class="label">Live transcript</div><div class="box" id="transcript" style="max-height:110px"></div></div>
  <div><div class="label">Meeting chat</div><div class="box" id="chat" style="max-height:80px"></div></div>
  <div style="flex:1;min-height:0;display:flex;flex-direction:column"><div class="label">Suggestion</div><div class="box" id="answer"></div></div>
  <textarea id="question" placeholder="Type a question / paste a problem, then Cmd+Enter"></textarea>
  <div id="status">Hotkeys: ⌘⇧Space hide · ⌘⇧C paste chat · ⌘⇧↩ suggest · ⌘⇧M mic · ⌘⇧X click-through</div>
</div>
<script src="app.js"></script>
</body>
</html>
